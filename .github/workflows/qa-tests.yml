name: QA Tests

on:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:

  # ─────────────────────────────────────────────
  # 1) Detecta setor — só executa quando a label
  #    adicionada for ERP, CRM ou SITE (não Ready for QA)
  #    ou quando um novo commit é enviado
  # ─────────────────────────────────────────────
  detect-labels:
    name: Detectar Setor
    runs-on: ubuntu-latest
    if: |
      github.event.action == 'synchronize' ||
      github.event.action == 'reopened'    ||
      contains(fromJSON('["ERP","CRM","SITE"]'), github.event.label.name)
    outputs:
      run_erp:  ${{ steps.labels.outputs.run_erp }}
      run_crm:  ${{ steps.labels.outputs.run_crm }}
      run_site: ${{ steps.labels.outputs.run_site }}
    steps:
      - name: Verificar labels de setor da PR
        id: labels
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          echo "Labels atuais: $LABELS"

          has_label() {
            echo "$LABELS" | jq -e --arg l "$1" 'map(select(. == $l)) | length > 0' > /dev/null
          }

          for sector in ERP CRM SITE; do
            key=$(echo "$sector" | tr '[:upper:]' '[:lower:]')
            if has_label "$sector"; then
              echo "run_${key}=true" >> $GITHUB_OUTPUT
              echo "✅ Setor '$sector' detectado"
            else
              echo "run_${key}=false" >> $GITHUB_OUTPUT
            fi
          done

  # ─────────────────────────────────────────────
  # 2a) Testes ERP
  # ─────────────────────────────────────────────
  test-erp:
    name: "Testes :: ERP"
    needs: detect-labels
    if: needs.detect-labels.outputs.run_erp == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes ERP
        env:
          TEST_ENVIRONMENT: "true"
          MYSQL_HOST: "127.0.0.1"
        run: pytest tests/erp/ -v

  # ─────────────────────────────────────────────
  # 2b) Testes CRM
  # ─────────────────────────────────────────────
  test-crm:
    name: "Testes :: CRM"
    needs: detect-labels
    if: needs.detect-labels.outputs.run_crm == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes CRM
        env:
          TEST_ENVIRONMENT: "true"
        run: pytest tests/crm/ -v

  # ─────────────────────────────────────────────
  # 2c) Testes SITE
  # ─────────────────────────────────────────────
  test-site:
    name: "Testes :: SITE"
    needs: detect-labels
    if: needs.detect-labels.outputs.run_site == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes SITE
        env:
          TEST_ENVIRONMENT: "true"
        run: pytest tests/site/ -v
